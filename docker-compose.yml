services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: furniture
      POSTGRES_PASSWORD: furniture
      POSTGRES_DB: furniture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  pgdata:
